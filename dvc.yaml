
stages:
  # Проверка полного набора данных по контракту.
  validate:
    cmd: python -m housing_price.validate_data --data data/raw/housing.csv --contract data/contract.json --report reports/validation/raw.json
    deps:
      - data/raw/housing.csv
      - data/contract.json
      - src/housing_price/validate_data.py
    outs:
      - reports/validation/raw.json

  # Разделение проверенных данных на train и test.
  split:
    cmd: python -m housing_price.split_data --params params.yaml
    deps:
      - data/raw/housing.csv
      - reports/validation/raw.json
      - src/housing_price/split_data.py
    params:
      - split
    outs:
      - data/split/train.csv
      - data/split/test.csv
