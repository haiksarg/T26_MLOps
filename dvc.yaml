
stages:
  # Проверка полного набора данных по контракту.
  validate:
    cmd: python -m housing_price.validate_data --data data/raw/housing.csv --contract data/contract.json --report reports/validation/raw.json
    deps:
      - data/raw/housing.csv
      - data/contract.json
      - src/housing_price/validate_data.py
    outs:
      - reports/validation/raw.json

  # Разделение проверенных данных на train и test.
  split:
    cmd: python -m housing_price.split_data --params params.yaml
    deps:
      - data/raw/housing.csv
      - reports/validation/raw.json
      - src/housing_price/split_data.py
    params:
      - split
    outs:
      - data/split/train.csv
      - data/split/test.csv
  # Предобработка признаков: fit только на train, transform на train и test.
  preprocess:
    cmd: python -m housing_price.preprocess --params params.yaml
    deps:
      - data/split/train.csv
      - data/split/test.csv
      - src/housing_price/preprocess.py
      - src/housing_price/features.py
    params:
      - preprocess
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - models/preprocessor.joblib
    metrics:
      - reports/preprocess_metrics.json:
          cache: false
  # Обучение принятой конфигурации (params.yaml → train), без MLflow. Запуски эксперимента — с флагом --mlflow.
  train:
    cmd: python -m housing_price.train --params params.yaml
    deps:
      - data/raw/housing.csv
      - reports/validation/raw.json
      - src/housing_price/train.py
      - src/housing_price/models.py
      - src/housing_price/split_data.py
      - src/housing_price/preprocess.py
      - src/housing_price/features.py
    params:
      - split
      - preprocess
      - train
    outs:
      - models/model.joblib
    metrics:
      - reports/train_metrics.json:
          cache: false
