name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,data,tracking]"
      - run: python -m housing_price.validate_data --data data/housing_sample.csv --contract data/contract.json --report reports/validation/lr2.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-report
          path: reports/validation/lr2.json
      - run: python -m ruff check .
      - run: python -m pytest -q --junitxml=reports/tests/lr5-pass.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: reports/tests/lr5-pass.xml
      - run: python -m housing_price

  # Пайплайн DVC с нуля: скачать полный набор по ссылке из data/raw/housing.csv.dvc,
  # убедиться, что контрольная сумма не изменилась, выполнить dvc repro.
  pipeline:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,data]"
      - run: dvc update data/raw/housing.csv.dvc
      - run: git diff --exit-code data/raw/housing.csv.dvc
      - run: dvc repro
      - run: dvc dag
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pipeline-reports
          path: reports/

  # Образ ЛР6: сборка с quality gate внутри Dockerfile, запуск через Compose до статуса healthy,
  # проверка образа скриптом inspect. Полный набор скачивается по ссылке из .dvc-файла.
  container:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[data]"
      - run: dvc update data/raw/housing.csv.dvc
      - run: |
          echo "IMAGE_TAG=lr6-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - run: python scripts/container_inspect.py --output reports/container/ci-inspect.txt
      - run: docker compose logs --no-color app
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-reports
          path: reports/container/
      - run: docker compose down
        if: always()
