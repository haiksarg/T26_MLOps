[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-price"
version = "0.1.0"
description = "Учебный MLOps-проект: прогнозирование стоимости жилья"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.0.6",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = [
    "dvc==3.67.1",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[project.scripts]
housing-price = "housing_price.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
