schema: '2.0'
stages:
  validate:
    cmd: python -m housing_price.validate_data --data data/raw/housing.csv 
      --contract data/contract.json --report reports/validation/raw.json
    deps:
    - path: data/contract.json
      hash: md5
      md5: 7ed346813e983e380c704a3b3bcf36dd
      size: 4016
    - path: data/raw/housing.csv
      hash: md5
      md5: d1c47305887e2252bf1ccbd74ff159a6
      size: 1423529
    - path: src/housing_price/validate_data.py
      hash: md5
      md5: 81b43f4da64329384edf0a6be96a99fc
      size: 12372
    outs:
    - path: reports/validation/raw.json
      hash: md5
      md5: de852648c450abf395abb85f807fa56e
      size: 5106
  split:
    cmd: python -m housing_price.split_data --params params.yaml
    deps:
    - path: data/raw/housing.csv
      hash: md5
      md5: d1c47305887e2252bf1ccbd74ff159a6
      size: 1423529
    - path: reports/validation/raw.json
      hash: md5
      md5: de852648c450abf395abb85f807fa56e
      size: 5106
    - path: src/housing_price/split_data.py
      hash: md5
      md5: 0f9b37f3be6d63b8b0d8a2ae8f3b718f
      size: 1834
    params:
      params.yaml:
        split:
          test_size: 0.2
          random_state: 42
          stratify_column: median_income
          stratify_bins:
          - 0.0
          - 1.5
          - 3.0
          - 4.5
          - 6.0
          - .inf
    outs:
    - path: data/split/test.csv
      hash: md5
      md5: 43bf3cb69bef728cce9fa97faebdb4a6
      size: 284811
    - path: data/split/train.csv
      hash: md5
      md5: 131680669808a555153454fe09f19b19
      size: 1138854
